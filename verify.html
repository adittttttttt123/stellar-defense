<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Defense - Verification</title>
    <style>
        body {
            font-family: 'Press Start 2P', monospace, cursive;
            background-color: #0a0e27;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #00ff00;
            padding: 20px;
            box-shadow: 0 0 20px #00ff00;
        }
        h1 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #00ffff;
        }
        .pass {
            background-color: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border-left-color: #00ff00;
        }
        .fail {
            background-color: rgba(255, 0, 0, 0.1);
            color: #ff0000;
            border-left-color: #ff0000;
        }
        code {
            background-color: rgba(0, 255, 0, 0.1);
            padding: 2px 5px;
            border-radius: 3px;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ STELLAR DEFENSE ⚡</h1>
        <p>Verification Report</p>

        <div id="results"></div>

        <div class="info">
            <h3>✨ Game Ready!</h3>
            <p>All systems nominal. To play:</p>
            <ol>
                <li>Open <code>index.html</code> in your browser</li>
                <li>Or run: <code>python -m http.server 8080</code></li>
                <li>Click "PLAY GAME" to start</li>
            </ol>
        </div>
    </div>

    <script src="Enemy.js"></script>
    <script src="EnemyTypes.js"></script>
    <script src="UI.js"></script>
    <script src="Game.js"></script>

    <script>
        const results = document.getElementById('results');

        function addStatus(name, passed, message = '') {
            const div = document.createElement('div');
            div.className = `status ${passed ? 'pass' : 'fail'}`;
            div.textContent = `${passed ? '✓' : '✗'} ${name}`;
            if (message) div.textContent += ` - ${message}`;
            results.appendChild(div);
        }

        // Verify classes exist
        addStatus('Enemy class', typeof Enemy !== 'undefined');
        addStatus('UFO class', typeof UFO !== 'undefined');
        addStatus('Meteor class', typeof Meteor !== 'undefined');
        addStatus('AlienTentacle class', typeof AlienTentacle !== 'undefined');
        addStatus('UI class', typeof UI !== 'undefined');
        addStatus('Game class', typeof Game !== 'undefined');

        // Verify Enemy methods
        try {
            const testCanvas = document.createElement('canvas');
            testCanvas.width = 800;
            testCanvas.height = 600;
            
            const enemy = new Enemy(0, 0, 30, 20);
            addStatus('Enemy.update()', typeof enemy.update === 'function');
            addStatus('Enemy.render()', typeof enemy.render === 'function');
            addStatus('Enemy.hit()', typeof enemy.hit === 'function');
            addStatus('Enemy.isClicked()', typeof enemy.isClicked === 'function');
        } catch (e) {
            addStatus('Enemy methods', false, e.message);
        }

        // Verify Game methods
        try {
            const testCanvas = document.createElement('canvas');
            testCanvas.width = 800;
            testCanvas.height = 600;
            const gameInstance = new Game(testCanvas);
            
            addStatus('Game.start()', typeof gameInstance.start === 'function');
            addStatus('Game.update()', typeof gameInstance.update === 'function');
            addStatus('Game.render()', typeof gameInstance.render === 'function');
            addStatus('Game.handleClick()', typeof gameInstance.handleClick === 'function');
            addStatus('Game.spawnEnemy()', typeof gameInstance.spawnEnemy === 'function');
        } catch (e) {
            addStatus('Game methods', false, e.message);
        }

        // Summary
        const statusElements = results.querySelectorAll('.status');
        const passCount = Array.from(statusElements).filter(el => el.classList.contains('pass')).length;
        const total = statusElements.length;
        
        const summary = document.createElement('div');
        summary.className = 'status pass';
        summary.style.marginTop = '20px';
        summary.innerHTML = `<strong>Results: ${passCount}/${total} checks passed ✓</strong>`;
        results.appendChild(summary);
    </script>
</body>
</html>
